<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Apps</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--line:#e0e0e5;--acc:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111114;--card:#1c1c21;--text:#f2f2f4;--sub:#9a9aa2;--line:#2c2c33;--acc:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:16px}
h1{font-size:22px;margin:0}
button{font:inherit;color:var(--acc);background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:#d93a3a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;padding:8px 16px 24px}
.app{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;cursor:pointer}
.app.dim{opacity:.55}
.ico{font-size:34px;line-height:1.2}
.nm{font-size:13px;margin-top:6px;word-break:break-word}
.empty{padding:32px 16px;color:var(--sub);text-align:center}
.panel{padding:0 16px 32px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:64px 1fr;gap:8px}
.row input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.row .full{grid-column:1/-1}
.row label{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#viewer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#viewer .top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
#viewer .top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer iframe{flex:1;border:0;width:100%;background:#fff}
a.btn{color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
</style>
</head>
<body>
<header><h1>My Apps</h1><div id="hdr"></div></header>
<div id="main"></div>
<div id="viewer">
  <div class="top"><button id="back">← Back</button><b id="vname"></b><a class="btn" id="vopen" target="_blank" rel="noopener">↗</a></div>
  <iframe id="frame" allow="camera; microphone; clipboard-write; fullscreen"></iframe>
</div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let apps = [], admin = false, editing = false;
let pw = sessionStorage.getItem("pw") || "";

async function load() {
  try {
    const r = await fetch("/api/apps", { headers: pw ? { "x-admin-password": pw } : {} });
    const d = await r.json();
    apps = d.apps || []; admin = !!d.admin;
    if (pw && !admin) { pw = ""; sessionStorage.removeItem("pw"); }
  } catch { apps = []; }
  render();
}

function render() {
  $("#hdr").innerHTML = admin
    ? `<button id="ed">${editing ? "Done" : "Edit"}</button> <button id="lo">Log out</button>`
    : `<button id="ad">Admin</button>`;
  if ($("#ed")) $("#ed").onclick = () => { editing = !editing; render(); };
  if ($("#lo")) $("#lo").onclick = () => { pw = ""; sessionStorage.removeItem("pw"); editing = false; load(); };
  if ($("#ad")) $("#ad").onclick = login;
  editing ? renderEditor() : renderGrid();
}

function renderGrid() {
  $("#main").innerHTML = apps.length
    ? `<div class="grid">${apps.map((a, i) => `<div class="app ${a.hidden ? "dim" : ""}" data-i="${i}">
        <div class="ico">${esc(a.icon || a.name.slice(0, 1))}</div><div class="nm">${esc(a.name)}</div></div>`).join("")}</div>`
    : `<div class="empty">No apps yet.${admin ? " Tap Edit to add one." : ""}</div>`;
  document.querySelectorAll(".app").forEach(el => el.onclick = () => open(apps[el.dataset.i]));
}

function renderEditor() {
  $("#main").innerHTML = `<div class="panel">
    <div class="bar">
      <button id="add">+ Add app</button><button id="imp">Import JSON</button><button id="exp">Export JSON</button>
      <button class="primary" id="save">Save</button>
    </div>
    ${apps.map((a, i) => `<div class="row" data-i="${i}">
      <input type="text" data-f="icon" value="${esc(a.icon)}" placeholder="🙂">
      <input type="text" data-f="name" value="${esc(a.name)}" placeholder="Name">
      <input type="text" class="full" data-f="url" value="${esc(a.url)}" placeholder="https://yourapp.netlify.app">
      <label><input type="checkbox" data-f="hidden" ${a.hidden ? "checked" : ""}> Hidden from visitors</label>
      <button class="danger" data-del="${i}">Remove</button>
    </div>`).join("")}
  </div>`;
  document.querySelectorAll(".row").forEach(row => {
    const i = row.dataset.i;
    row.querySelectorAll("[data-f]").forEach(inp => inp.oninput = () =>
      apps[i][inp.dataset.f] = inp.type === "checkbox" ? inp.checked : inp.value);
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { apps.splice(b.dataset.del, 1); renderEditor(); });
  $("#add").onclick = () => { apps.push({ id: crypto.randomUUID(), name: "", icon: "", url: "https://", hidden: false }); renderEditor(); };
  $("#save").onclick = save;
  $("#exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(apps, null, 2)], { type: "application/json" }));
    a.download = "apps.json"; a.click();
  };
  $("#imp").onclick = () => $("#file").click();
}

$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    apps = Array.isArray(d) ? d : d.apps;
    renderEditor();
  } catch { alert("That file isn’t valid JSON."); }
  e.target.value = "";
};

async function save() {
  const r = await fetch("/api/apps", {
    method: "PUT",
    headers: { "Content-Type": "application/json", "x-admin-password": pw },
    body: JSON.stringify({ apps })
  });
  const d = await r.json();
  if (d.ok) { apps = d.apps; editing = false; render(); } else alert(d.error || "Save failed");
}

function login() {
  const p = prompt("Admin password");
  if (!p) return;
  pw = p; sessionStorage.setItem("pw", p);
  load().then(() => { if (!admin) alert("Wrong password"); });
}

function open(a) {
  $("#vname").textContent = a.name;
  $("#vopen").href = a.url;
  $("#frame").src = a.url;
  $("#viewer").style.display = "flex";
}
$("#back").onclick = () => { $("#viewer").style.display = "none"; $("#frame").src = "about:blank"; };

load();
</script>
</body>
</html>
